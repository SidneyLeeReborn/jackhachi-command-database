<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Jackhachi Face Calibration</title>
  <link rel="stylesheet" href="./style.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <main class="machine">
    <section id="face-stage" aria-label="Interactive 3D Jackhachi face">
      <div id="loading">LOADING INDUSTRIAL FACE...</div>
      <canvas id="face-canvas"></canvas>
      <div id="smoke-layer" aria-hidden="true"></div>
      <div id="paint-cursor" aria-hidden="true"></div>
      <div id="paint-tools" class="paint-tools">
        <button id="paint-toggle" type="button" aria-pressed="false"><img src="./paint-pot.png" alt="">PAINT</button>
        <div id="paint-options" class="paint-options" hidden>
          <button type="button" data-paint-panel="ink">INK <span id="paint-colour-swatch" class="paint-colour-swatch"></span></button>
          <button type="button" data-paint-panel="size">SIZE</button>
          <button type="button" data-paint-panel="hardness">SMOOTHNESS</button>
          <button type="button" data-paint-panel="opacity">OPACITY</button>
          <button id="paint-eraser" type="button" aria-pressed="false">ERASE</button>
          <button id="paint-undo" type="button" disabled>UNDO</button>
          <button id="paint-redo" type="button" disabled>REDO</button>
          <button id="paint-clear" type="button">CLEAN</button>
          <div id="paint-panel-ink" class="paint-panel paint-ink-panel" hidden>
            <div id="paint-palette" class="paint-palette" aria-label="Classic MS Paint colours"></div>
            <label class="custom-colour">CUSTOM <input id="paint-colour" type="color" value="#ff00ff"></label>
          </div>
          <div id="paint-panel-size" class="paint-panel" hidden>
            <label><span>BRUSH SIZE</span><input id="paint-size" type="range" min="4" max="96" value="24"><output id="paint-size-value">24</output></label>
          </div>
          <div id="paint-panel-hardness" class="paint-panel" hidden>
            <label><span>SMOOTHNESS</span><input id="paint-hardness" type="range" min="0" max="100" value="25"><output id="paint-hardness-value">25%</output></label>
          </div>
          <div id="paint-panel-opacity" class="paint-panel" hidden>
            <label><span>OPACITY</span><input id="paint-opacity" type="range" min="5" max="100" value="100"><output id="paint-opacity-value">100%</output></label>
          </div>
        </div>
      </div>
      <button id="joint-toggle" class="item-button joint-button" type="button" aria-pressed="false" title="Drop joint" disabled>
        <img src="./joint-icon.png" alt="Drop Jackhachi's joint">
        <span>JOINT</span>
      </button>
      <button id="bandana-toggle" class="item-button bandana-button" type="button" aria-pressed="false" title="Equip Sidney bandana" disabled>
        <img src="./sidney-bandana-icon.png" alt="Equip Jackhachi's Sidney bandana">
        <span>SIDNEY<br>BANDANA</span>
      </button>
      <button id="durag-toggle" class="item-button" type="button" aria-pressed="false" title="Equip durag" disabled>
        <img src="./durag-icon.png" alt="Equip Jackhachi's durag">
        <span>DURAG</span>
      </button>
    </section>

    <div class="controls">
      <a href="../">&lt;&lt; RETURN TO COMMAND DATABASE</a>
    </div>
    <footer>WARNING: EXCESSIVE FACE MANIPULATION MAY VOID MISHIMA WARRANTY.</footer>
  </main>

  <script type="module" src="./app.js?v=gyro-1"></script>
</body>
</html>
